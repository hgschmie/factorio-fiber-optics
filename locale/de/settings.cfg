[mod-setting-name]
hps__fo-debug-mode=Fehlerbereinigungsmodus
hps__fo-network_refresh=Netzwerk-Aktualisierungsintervall
hps__fo-fo_refresh=Verbinder-Aktualisierungsintervall

[mod-setting-description]
hps__fo-debug-mode=Aktiviert Informationen zur Fehlerbereinigung.
hps__fo-network_refresh=Wie oft die bestehenden Glasfasernetzwerke auf deaktivierte oder ungültige Verbindungen überprüft werden. Niedrige Werte können die FPS in großen Spielen beeinflussen.
hps__fo-fo_refresh=Wie oft jeder Glasfaserverbinder seinen Status auf Verbindungsänderungen überprüft. Niedrige Werte können die FPS in großen Spielen beeinflussen.

[string-mod-setting]
#<setting-name>-<dropdown-item-name>=<translated item>
hps__fo-debug-mode-0=Aus
hps__fo-debug-mode-1=Zeige Netzwerk Verbindungsereignisse
hps__fo-debug-mode-2=Mache interne Verbindungspunkte sichtbar
hps__fo-debug-mode-3=(nicht verwendet)
