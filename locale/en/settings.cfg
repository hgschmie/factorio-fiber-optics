[mod-setting-name]
hps__fo-debug-mode=Debugging Mode
hps__fo-network_refresh=Network refresh interval
hps__fo-fo_refresh=Connector refresh interval

[mod-setting-description]
hps__fo-debug-mode=Enable debugging of the Fiber Optics code.
hps__fo-network_refresh=How often the existing fiber networks are scanned for disabled or invalid connections. Setting this to low values will affect FPS for large games.
hps__fo-fo_refresh=How often each fiber connector checks its status for connection changes. Setting this to low values will affect FPS for large games.

[string-mod-setting]
#<setting-name>-<dropdown-item-name>=<translated item>
hps__fo-debug-mode-0=Off
hps__fo-debug-mode-1=Show network connect/disconnect
hps__fo-debug-mode-2=Show internal fiber hubs
hps__fo-debug-mode-3=(unused)
